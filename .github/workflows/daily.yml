# 本工作流只负责「生成站点 + 部署发布」，抓取已搬到境内的腾讯云函数（见 scf/README.md）。
#
# 为什么拆开：
#   数据源 ahut.ahbys.com 在国内（安徽电信单机、无 CDN），GitHub 托管 runner 在境外，
#   97 次请求跨洋要十几分钟；放进境内云函数后只要约 46 秒，
#   跨洋环节从「97 次请求」压缩成「云函数提交 dataset.json」这 1 次。
#
# 触发方式（三条，前两条可能撞车，用 concurrency 排队）：
#   A. push data/dataset.json —— 主链路。云函数抓完提交后自动触发本工作流。
#   B. schedule              —— 兜底。云函数万一没跑，每天仍会用已有数据重建一次站点。
#   C. workflow_dispatch      —— Actions 页面手动触发。
#
# ★ 重要：本工作流不再回写 data/dataset.json（权限只给 contents: read）。
#   如果在这里提交，会再次触发 A 形成死循环 —— 数据写入统一由云函数负责。
#
# 部署云函数后，config/config.json -> profile.schedule.daily_at 要同步到
# 云函数的定时触发器（北京时间，不用换算 UTC）。本文件里的 cron 仍需与 config 一致，
# 改完运行 `python scripts/sync_workflow.py`（CI 也会校验）。
#
# 两条发布通道，可同时启用：
#   A. GitHub Pages（推荐，免费、地址永久固定、无需任何密钥）
#      仓库 → Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
#      地址形如 https://<用户名>.github.io/<仓库名>/
#   B. 码上架（可选，需要 Secret）
#      Settings → Secrets and variables → Actions → New repository secret
#      名称取 config/config.json -> publish.provider.credentials.login_token_env
#      （默认 MASHANGJIA_LOGIN_TOKEN，改了配置这里也要同步改）
#      值为码上架控制台「API Token」页面生成的登录 Token
#      发布目标站点 / 固定地址同样在 config/config.json -> publish 的 site / site_url
#
# 一次性配置：Settings → Actions → General → Workflow permissions → 选 Read and write

name: daily-update

on:
  push:
    branches: [main]
    paths:
      - data/dataset.json     # 云函数提交数据后自动触发；只改代码不会误触发部署

  schedule:
    # UTC 18:00 = 北京时间次日 02:00（由 config/config.json -> profile.schedule 生成，改时间后运行 python scripts/sync_workflow.py）
    # 兜底用：云函数没跑时，至少用已有数据重建一次站点
    - cron: "0 18 * * *"

  workflow_dispatch:      # 允许在 Actions 页面手动触发

concurrency:
  group: daily-update     # push 与 schedule 撞车时排队，不并发部署
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 不再抓取，正常几十秒；设上限防止异常时一直挂着

    permissions:
      contents: read      # 只读：数据由云函数写入，这里不回写（回写会循环触发）
      pages: write        # 部署 GitHub Pages
      id-token: write     # Pages OIDC

    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    env:
      MASHANGJIA_LOGIN_TOKEN: ${{ secrets.MASHANGJIA_LOGIN_TOKEN }}
      PYTHONUNBUFFERED: "1"   # 让 Python 日志实时刷出来，卡住时看得到进度

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验自动更新时间
        run: python scripts/sync_workflow.py --check

      - name: 生成站点
        # --from-dataset：跳过抓取，直接用云函数提交的 data/dataset.json 重建页面，
        # 因此本步骤完全不访问国内站点。
        run: python scripts/daily_update.py --from-dataset

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: 准备 Node（码上架发布用）
        if: env.MASHANGJIA_LOGIN_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 显示码上架目标站点地址
        if: env.MASHANGJIA_LOGIN_TOKEN != ''
        run: python scripts/publish.py --print-url
        # 地址来自 config/config.json -> publish.site_url（留空则由 site_url_pattern 推导）

      - name: 同步发布到码上架
        if: env.MASHANGJIA_LOGIN_TOKEN != ''
        run: python scripts/publish.py
        # publish.py 会读 config/config.json -> publish.site 定向更新该站点。
        # 绑定自定义域名后必须走这种「按站点更新」的方式，按目录发布会新建站点。

      - name: 上传站点产物
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
