# 每天在 config/config.json -> profile.schedule.daily_at 设定的时间（北京时间，默认 02:00）
# 于 GitHub 服务器上自动抓取招聘会并重新发布站点。
# 改完时间记得运行 `python scripts/sync_workflow.py` 把下面的 cron 同步过来（CI 也会校验）。
#
# 两条发布通道，可同时启用：
#   A. GitHub Pages（推荐，免费、地址永久固定、无需任何密钥）
#      仓库 → Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
#      地址形如 https://<用户名>.github.io/<仓库名>/
#   B. 码上架（可选，需要 Secret）
#      Settings → Secrets and variables → Actions → New repository secret
#      名称取 config/config.json -> publish.provider.credentials.login_token_env
#      （默认 MASHANGJIA_LOGIN_TOKEN，改了配置这里也要同步改）
#      值为码上架控制台「API Token」页面生成的登录 Token
#      发布目标站点 / 固定地址同样在 config/config.json -> publish 的 site / site_url
#
# 一次性配置：Settings → Actions → General → Workflow permissions → 选 Read and write
#
# 注意：GitHub Actions 的 schedule 不保证准点，高峰时可能延迟几分钟到半小时。
# 需要严格准点请用自建服务器 cron（见 README）。

name: daily-update

on:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00（由 config/config.json -> profile.schedule 生成，改时间后运行 python scripts/sync_workflow.py）
    - cron: "0 18 * * *"
  workflow_dispatch:      # 允许在 Actions 页面手动触发

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write    # 回写 dataset.json
      pages: write       # 部署 GitHub Pages
      id-token: write    # Pages OIDC

    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    env:
      MASHANGJIA_LOGIN_TOKEN: ${{ secrets.MASHANGJIA_LOGIN_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 恢复详情缓存
        uses: actions/cache@v4
        with:
          path: data/cache
          key: recruit-detail-cache-${{ github.run_id }}
          restore-keys: |
            recruit-detail-cache-

      - name: 校验自动更新时间
        run: python scripts/sync_workflow.py --check

      - name: 抓取并生成站点
        run: python scripts/daily_update.py

      - name: 提交数据变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dataset.json
          if git diff --cached --quiet; then
            echo "本次无数据变更"
          else
            git commit -m "chore(data): 每日自动更新 $(date -u +'%Y-%m-%d')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: 准备 Node（码上架发布用）
        if: env.MASHANGJIA_LOGIN_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 显示码上架目标站点地址
        if: env.MASHANGJIA_LOGIN_TOKEN != ''
        run: python scripts/publish.py --print-url
        # 地址来自 config/config.json -> publish.site_url（留空则由 site_url_pattern 推导）

      - name: 同步发布到码上架
        if: env.MASHANGJIA_LOGIN_TOKEN != ''
        run: python scripts/publish.py
        # publish.py 会读 config/config.json -> publish.site 定向更新该站点。
        # 绑定自定义域名后必须走这种「按站点更新」的方式，按目录发布会新建站点。

      - name: 上传站点产物
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
